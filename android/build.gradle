apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.bondhu_social"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bondhu_social"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
