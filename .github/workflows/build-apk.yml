name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout project
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Setup Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # ==========================================
      # 4. Check Flutter
      # ==========================================
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # ==========================================
      # 5. Generate Android project
      #
      # IMPORTANT:
      # This creates the missing android/ folder.
      # Existing lib/, assets/, pubspec.yaml etc.
      # are preserved.
      # ==========================================
      - name: Create Android Project
        run: |
          flutter create \
            --platforms=android \
            --project-name=bondhu_social \
            .

      # ==========================================
      # 6. Show Android structure
      # ==========================================
      - name: Check Android Project
        run: |
          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="
          find android -maxdepth 4 -type f | sort

      # ==========================================
      # 7. Install Flutter dependencies
      # ==========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ==========================================
      # 8. Analyze Dart project
      #
      # continue-on-error prevents warnings from
      # stopping the APK build.
      # ==========================================
      - name: Flutter Analyze
        continue-on-error: true
        run: |
          flutter analyze

      # ==========================================
      # 9. Build Release APK
      # ==========================================
      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release -v

      # ==========================================
      # 10. Check APK
      # ==========================================
      - name: Check APK
        run: |
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="
          find build/app/outputs/flutter-apk -type f -maxdepth 2 -print

      # ==========================================
      # 11. Upload APK as GitHub Actions artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
