name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bondhu Social APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      # ==========================================================
      # CHECK FLUTTER
      # ==========================================================

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # ==========================================================
      # CHECK PROJECT
      # ==========================================================

      - name: Check project files
        run: |
          echo "Checking project..."

          test -f pubspec.yaml
          test -f android/app/google-services.json

          echo "Project files found."

      # ==========================================================
      # SHOW PUBSPEC
      # ==========================================================

      - name: Verify pubspec.yaml
        run: |
          echo "===== pubspec.yaml ====="
          cat pubspec.yaml
          echo "========================"

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Flutter clean
        run: flutter clean

      # ==========================================================
      # GET DEPENDENCIES
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get

      # ==========================================================
      # ANALYZE
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build Release APK
        run: flutter build apk --release

      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          echo "===== APK OUTPUT ====="
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully created."

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
