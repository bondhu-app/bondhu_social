name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bondhu Social APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Check Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt
          echo "Android project OK"

      - name: Check Firebase
        run: |
          test -f android/app/google-services.json
          echo "Firebase configuration OK"

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Search Android v1 embedding
        shell: bash
        run: |
          echo "===== Flutter v1 embedding search ====="

          grep -RInE \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar" \
            android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            || true

          echo "===== MainActivity ====="
          cat android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt

          echo "===== AndroidManifest ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== Search finished ====="

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
