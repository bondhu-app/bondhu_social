name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bondhu Social APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      # ==========================================================
      # FLUTTER VERSION
      # ==========================================================

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # ==========================================================
      # CHECK ANDROID PROJECT
      # ==========================================================

      - name: Check Android project
        run: |
          echo "===== Checking Android project ====="

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt

          echo "Android project OK"

      # ==========================================================
      # CHECK FIREBASE
      # ==========================================================

      - name: Check Firebase
        run: |
          echo "===== Checking Firebase ====="

          test -f android/app/google-services.json

          echo "Firebase configuration OK"

      # ==========================================================
      # FLUTTER CLEAN
      # ==========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # GET DEPENDENCIES
      # ==========================================================

      - name: Get dependencies
        run: |
          flutter pub get

      # ==========================================================
      # SHOW DEPENDENCIES
      # ==========================================================

      - name: Show Flutter dependencies
        run: |
          echo "===== Flutter dependency tree ====="
          flutter pub deps

      # ==========================================================
      # SEARCH V1 EMBEDDING
      #
      # IMPORTANT:
      # Search BOTH project AND PUB CACHE.
      # Old plugin may contain Flutter v1 embedding.
      # ==========================================================

      - name: Search Android v1 embedding
        shell: bash
        run: |
          echo "=================================================="
          echo "SEARCHING FOR FLUTTER ANDROID V1 EMBEDDING"
          echo "=================================================="

          echo ""
          echo "===== PROJECT SEARCH ====="

          grep -RInE \
            "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterFragmentActivity|PluginRegistry\.Registrar|registerWith" \
            android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            || true

          echo ""
          echo "===== PUB CACHE SEARCH ====="

          if [ -d "$HOME/.pub-cache" ]; then

            grep -RInE \
              "io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterFragmentActivity|PluginRegistry\.Registrar|registerWith" \
              "$HOME/.pub-cache" \
              --include="*.java" \
              --include="*.kt" \
              --include="*.gradle" \
              --include="*.dart" \
              2>/dev/null \
              || true

          else
            echo "Pub cache not found."
          fi

          echo ""
          echo "===== MAIN ACTIVITY ====="

          cat android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt

          echo ""
          echo "===== ANDROID MANIFEST ====="

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== SEARCH COMPLETE ====="

      # ==========================================================
      # CHECK GRADLE FILES
      # ==========================================================

      - name: Check Gradle configuration
        run: |
          echo "===== android/settings.gradle ====="
          cat android/settings.gradle || true

          echo ""
          echo "===== android/build.gradle ====="
          cat android/build.gradle || true

          echo ""
          echo "===== android/app/build.gradle ====="
          cat android/app/build.gradle || true

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build APK
        run: |
          flutter build apk --release -v

      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "=================================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=================================================="

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
