name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bondhu Social APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # FLUTTER 3.47.0
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      # ==========================================================
      # CHECK FLUTTER
      # ==========================================================

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # ==========================================================
      # CHECK REQUIRED FILES
      # ==========================================================

      - name: Check Android project
        run: |
          echo "===== Android project check ====="

          test -f android/app/src/main/AndroidManifest.xml

          test -f android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt

          echo "Android project files found."

      # ==========================================================
      # CHECK FIREBASE
      # ==========================================================

      - name: Check Firebase
        run: |
          echo "===== Firebase check ====="

          test -f android/app/google-services.json

          echo "Firebase configuration found."

      # ==========================================================
      # FLUTTER CLEAN
      # ==========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # GET DEPENDENCIES
      # ==========================================================

      - name: Get dependencies
        run: |
          flutter pub get

      # ==========================================================
      # DIAGNOSE ANDROID V1 EMBEDDING
      # ==========================================================

      - name: Diagnose Android v1 embedding
        shell: bash
        run: |

          echo "=================================================="
          echo "ANDROID PROJECT FILES"
          echo "=================================================="

          find android -type f | sort

          echo ""
          echo "=================================================="
          echo "SEARCHING FOR FLUTTER V1 EMBEDDING"
          echo "=================================================="

          find android -type f \
            \( -name "*.java" -o -name "*.kt" -o -name "*.gradle" -o -name "*.xml" \) \
            -print0 | xargs -0 grep -nEi \
            "io\.flutter\.app|PluginRegistry\.Registrar|registerWith|flutterEmbedding" \
            || true

          echo ""
          echo "=================================================="
          echo "MAIN ACTIVITY"
          echo "=================================================="

          cat android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt

          echo ""
          echo "=================================================="
          echo "ANDROID MANIFEST"
          echo "=================================================="

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=================================================="
          echo "SETTINGS.GRADLE"
          echo "=================================================="

          cat android/settings.gradle || true

          echo ""
          echo "=================================================="
          echo "ANDROID BUILD.GRADLE"
          echo "=================================================="

          cat android/build.gradle || true

          echo ""
          echo "=================================================="
          echo "APP BUILD.GRADLE"
          echo "=================================================="

          cat android/app/build.gradle || true

          echo ""
          echo "=================================================="
          echo "GRADLE PROPERTIES"
          echo "=================================================="

          cat android/gradle.properties || true

          echo ""
          echo "=================================================="
          echo "DIAGNOSTIC COMPLETE"
          echo "=================================================="

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build APK
        run: |
          flutter build apk --release -v

      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "=================================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=================================================="

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
