name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Bondhu Social APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # FLUTTER
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      # ==========================================================
      # CHECK FLUTTER
      # ==========================================================
      - name: Check Flutter
        run: flutter --version

      # ==========================================================
      # CHECK ANDROID PROJECT
      # ==========================================================
      - name: Check Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/bondhu/social/MainActivity.kt
          echo "Android project found"
          echo "MainActivity.kt found"

      # ==========================================================
      # CHECK FIREBASE
      # ==========================================================
      - name: Check Firebase configuration
        run: |
          test -f android/app/google-services.json
          echo "google-services.json found"

      # ==========================================================
      # CHECK PUBSPEC
      # ==========================================================
      - name: Check pubspec.yaml
        run: |
          test -f pubspec.yaml
          grep -q "uses-material-design: true" pubspec.yaml
          echo "pubspec.yaml is valid"

      # ==========================================================
      # FLUTTER CLEAN
      # ==========================================================
      - name: Flutter clean
        run: flutter clean

      # ==========================================================
      # GET DEPENDENCIES
      # ==========================================================
      - name: Get dependencies
        run: flutter pub get

      # ==========================================================
      # BUILD RELEASE APK
      # ==========================================================
      - name: Build APK
        run: flutter build apk --release

      # ==========================================================
      # VERIFY APK
      # ==========================================================
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully created"

      # ==========================================================
      # UPLOAD APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
