name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Setup Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # ==========================================
      # 4. Flutter information
      # ==========================================
      - name: Flutter Version
        run: |
          flutter --version

      # ==========================================
      # 5. Create missing Android project
      # ==========================================
      - name: Create Android Project
        run: |
          flutter create \
            --platforms=android \
            --project-name=bondhu_social \
            .

      # ==========================================
      # 6. Verify Android project
      # ==========================================
      - name: Verify Android Project
        run: |
          echo "=========================================="
          echo "ANDROID FOLDER"
          echo "=========================================="

          if [ ! -d "android" ]; then
            echo "ERROR: android folder was not created."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle settings file not found."
            exit 1
          fi

          echo "Android project created successfully."

          echo "=========================================="
          echo "ANDROID FILES"
          echo "=========================================="

          find android -maxdepth 4 -type f | sort

      # ==========================================
      # 7. Flutter dependencies
      # ==========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # ==========================================
      # 8. Flutter Analyze
      # ==========================================
      - name: Flutter Analyze
        continue-on-error: true
        run: |
          flutter analyze

      # ==========================================
      # 9. Clean build
      # ==========================================
      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      # ==========================================
      # 10. Build APK
      # ==========================================
      - name: Build Release APK
        run: |
          flutter build apk --release -v

      # ==========================================
      # 11. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-social-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
